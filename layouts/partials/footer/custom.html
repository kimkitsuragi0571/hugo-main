<!-- 返回顶部按钮样式 -->
<style>
  #backTopBtn {
    position: fixed;
    bottom: 30px;
    right: 20px;
    z-index: 99;
    cursor: pointer;
    width: 30px;
    height: 30px;
    background-image: url('{{ with resources.Get "icons/backTop.svg" }}{{ .Permalink }}{{ else }}/icons/backTop.svg{{ end }}');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    border: none;
    outline: none;
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);
    transition: opacity .25s ease, transform .25s ease, visibility .25s ease;
  }
  #backTopBtn.show { opacity: 1; visibility: visible; transform: none; }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    // ===== 1. TOC 折叠逻辑 =====
    function initTocHide() {
      const toc = document.querySelector(".widget--toc");
      if (!toc) return;

      let timer = null;
      window.addEventListener('scroll', () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          // 移除所有 open
          document.querySelectorAll('.open').forEach(el => el.classList.remove('open'));

          // 查找当前激活项（兼容多种 class）
          const activeLink = document.querySelector(
            ".toc-link.active, .toc-link.active-class, .active, .active-class"
          );
          if (!activeLink) return;

          // 展开子列表
          const nextSibling = activeLink.nextElementSibling;
          if (nextSibling && (nextSibling.tagName === 'UL' || nextSibling.tagName === 'OL')) {
            nextSibling.classList.add('open');
          }

          // 向上展开所有父级列表
          let parent = activeLink.parentElement;
          while (parent && parent.parentElement) {
            if (parent.tagName === 'UL' || parent.tagName === 'OL') {
              parent.classList.add('open');
            }
            parent = parent.parentElement;
          }
        }, 80);
      });
    }

    // ===== 2. 返回顶部按钮(淡入淡出) =====
    function initScrollTop() {
      const btn = document.createElement("div");
      btn.id = "backTopBtn";
      btn.setAttribute("aria-label", "回到顶部");
      btn.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
      document.body.appendChild(btn);

      let ticking = false;
      const upd = () => {
        btn.classList.toggle("show", window.scrollY > 240);
        ticking = false;
      };
      window.addEventListener("scroll", () => {
        if (!ticking) { ticking = true; requestAnimationFrame(upd); }
      }, { passive: true });
      upd();
    }

    // ===== 3. 滚动显现 =====
    function initReveal() {
      const els = document.querySelectorAll(".app-right .app-block");
      if (!els.length) return;
      if (!("IntersectionObserver" in window)) {
        els.forEach(el => el.classList.add("in"));
        return;
      }
      const io = new IntersectionObserver((entries) => {
        entries.forEach(en => {
          if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
        });
      }, { threshold: 0.08, rootMargin: "0px 0px -8% 0px" });
      els.forEach(el => { el.classList.add("reveal"); io.observe(el); });
    }

    // ===== 4. 阅读进度条 =====
    function initReadProgress() {
      const bar = document.querySelector('.read-progress');
      if (!bar) return;
      const doc = document.documentElement;
      let ticking = false;
      const upd = () => {
        const max = doc.scrollHeight - window.innerHeight;
        const p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
        bar.style.transform = 'scaleX(' + p + ')';
        ticking = false;
      };
      window.addEventListener('scroll', () => {
        if (!ticking) { ticking = true; requestAnimationFrame(upd); }
      }, { passive: true });
      window.addEventListener('resize', upd);
      upd();
    }

    // ===== 5. 极简图片灯箱(替代 PhotoSwipe) =====
    function initLightbox() {
      const imgs = document.querySelectorAll('.article-content img');
      if (!imgs.length) return;
      const box = document.createElement('div');
      box.className = 'app-lightbox';
      const big = document.createElement('img');
      box.appendChild(big);
      document.body.appendChild(box);
      const close = () => box.classList.remove('show');
      box.addEventListener('click', close);
      document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
      imgs.forEach(img => {
        img.addEventListener('click', () => {
          big.src = img.currentSrc || img.src;
          box.classList.add('show');
        });
      });
    }

    // 执行初始化
    initTocHide();
    initScrollTop();
    initReveal();
    initReadProgress();
    initLightbox();
  });
</script>
