<!-- hover 下划线按钮组件：上下双划线同步动画。已改为页脚内联装饰(不再固定悬浮)，避免与右下角组件重叠 -->
<style>
  /* 父容器：承载顶部划线 */
  .btn-wrap {
    color: #ffffff95;
    font-size: 14px;
    border: none;
    background: transparent;
    padding: 0;
    margin: 0;
    display: inline-block;
    position: relative;
  }

  /* 按钮本体：保留鼠标穿透，不拦截页面点击，不影响动画 */
  .footer-hover-btn {
    color: #ffffff95;
    font-size: 14px;
    border: none;
    background: transparent;
    font-weight: 600;
    font-family: 'Poppins', sans-serif;
    cursor: pointer;
    outline: none;
    padding: 12px 20px;
    margin: 0;
    display: inline-block;
    position: relative;
    pointer-events: none;
  }

  /* 顶部 左右上划线 */
  .btn-wrap::before {
    content: '';
    width: 0%;
    height: 2px;
    background: #1900ff;
    transition: 0.5s ease;
    position: absolute;
    left: 0;
    top: 8px;
  }
  .btn-wrap::after {
    content: '';
    width: 0%;
    height: 2px;
    background: #f44336;
    transition: 0.5s ease;
    position: absolute;
    right: 0;
    top: 8px;
  }

  /* 底部 左右下划线 */
  .footer-hover-btn::before {
    content: '';
    width: 0%;
    height: 2px;
    background: #1900ff;
    transition: 0.5s ease;
    position: absolute;
    left: 0;
    bottom: 8px;
  }
  .footer-hover-btn::after {
    content: '';
    width: 0%;
    height: 2px;
    background: #f44336;
    transition: 0.5s ease;
    position: absolute;
    right: 0;
    bottom: 8px;
  }

  /* 鼠标悬浮时，上下 4 条线同步展开到 50% */
  .btn-wrap:hover::before,
  .btn-wrap:hover::after,
  .btn-wrap:hover .footer-hover-btn::before,
  .btn-wrap:hover .footer-hover-btn::after {
    width: 50%;
  }

  /* 手机端适配 */
  @media (max-width: 768px) {
    .footer-hover-btn {
      padding: 8px 12px;
    }
  }
</style>

<div class="btn-wrap">
  <button class="footer-hover-btn">
    --KK57-0803.0815--
  </button>
</div>
