<!-- 左侧顶部滑入弹窗（完全收回版） -->
<div id="toast-stack"></div>

<script>
/* ===== 通知队列 ===== */
(() => {
  const toastStack = document.getElementById('toast-stack');
  let toastCount = 0;
  const MAX_TOAST = 5;
  const DURATION  = 2500;

  /* 500 ms 内同文本只弹一次 */
  let lastText = '';
  let lastTime = 0;

  window.pushToast = function (msg = '✅ 复制成功 ') {
    const now = Date.now();
    if (msg === lastText && now - lastTime < 500) return; // 同文本 500ms 内忽略
    lastText = msg;
    lastTime = now;

    /* 超量时移除最早一条 */
    if (toastCount >= MAX_TOAST) toastStack.firstElementChild?.closeToast();

    const item = document.createElement('div');
    item.className = 'snack-left-top';
    item.textContent = msg;

    let closeTimer = null;
    function closeToast() {
      if (item.isClosing) return;
      item.isClosing = true;
      item.classList.remove('show');
      item.addEventListener('transitionend', () => {
        item.remove();
        toastCount--;
      }, { once: true });
      clearTimeout(closeTimer);
    }
    item.closeToast = closeToast;

    toastStack.appendChild(item);
    toastCount++;
    void item.offsetWidth;
    item.classList.add('show');
    closeTimer = setTimeout(closeToast, DURATION);
  };

  /* ===== 全局复制 ===== */
  document.addEventListener('copy', e => {
    const text = window.getSelection().toString().trim();
    if (!text) return;
    e.preventDefault();
    navigator.clipboard.writeText(text)
      .then(() => pushToast())
      .catch(console.warn);
  });

  /* ===== 代码块按钮复制 ===== */
  const container = document.querySelector('.article-content');
  if (container) {
    container.addEventListener('click', e => {
      if (!e.target.matches('.copyCodeButton')) return;
      const wrap = e.target.closest('pre, .highlight');
      const codeEl = wrap?.querySelector('code[data-lang]') || wrap;
      if (!codeEl) return;
      const clone = codeEl.cloneNode(true);
      clone.querySelectorAll('.ln, .lnt').forEach(el => el.remove());
      const txt = clone.textContent.trim();
      navigator.clipboard.writeText(txt)
        .then(() => pushToast())
        .catch(err => alert('复制失败：' + err));
    });
  }
})();
</script>

<style>
/* ===== 代码块复制按钮:与淡灰代码块统一 ===== */
.article-content .highlight .copyCodeButton{
  position:absolute;
  top:10px;
  right:10px;
  border:1px solid var(--a-sep);
  border-radius:100px;
  background:var(--a-bg);
  color:var(--a-text2);
  padding:3px 12px;
  font-size:12px;
  font-weight:500;
  line-height:1.6;
  box-shadow:none !important;
  cursor:pointer;
  opacity:0;
  transition:opacity .2s, background .15s, color .15s, border-color .15s;
  z-index:2;
}
.article-content .highlight:hover .copyCodeButton{opacity:1;}
.article-content .highlight .copyCodeButton:hover{background:var(--a-side);color:var(--a-text);}

/* ===== 复制提示:底部居中胶囊,与主界面统一 ===== */
#toast-stack{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  z-index:9999;
  pointer-events:none;
}
.snack-left-top{
  pointer-events:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  max-width:80vw;
  padding:9px 18px;
  border-radius:100px;
  background:#2b2f36;
  color:#fff;
  font-size:13px;
  font-weight:500;
  line-height:1.4;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
  opacity:0;
  transform:translateY(12px);
  transition:opacity .22s ease, transform .22s ease;
}
.snack-left-top.show{opacity:1;transform:translateY(0);}
[data-scheme="dark"] .snack-left-top{background:#e6e9ef;color:#1f2937;}
</style>
