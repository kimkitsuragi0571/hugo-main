<!-- 代码块过长折叠&展开 - 静态路径版 极简无报错 -->
<style>
    .highlight {
        max-height: 400px;
        overflow: hidden;
        position: relative; /* 补全定位样式，遮罩层正常显示 */
    }

    .code-show {
        max-height: none !important;
    }

    .code-more-box {
        width: 100%;
        padding-top: 40px;
        background-image: linear-gradient(to bottom, rgba(244,245,247,0), #f4f5f7);
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1;
        display: flex;
        justify-content: center;
    }

    [data-scheme="dark"] .code-more-box {
        background-image: linear-gradient(to bottom, rgba(22,27,38,0), #161b26);
    }

    .code-more-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 20px;
        margin: 0 auto;
        background: var(--a-bg, #fff);
        border: 1px solid var(--a-sep, #e9edf2);
        border-radius: 100px;
        cursor: pointer;
        transition: background .15s, border-color .15s;
    }

    .code-more-btn:hover {
        background: var(--a-side, #f5f6f8);
    }

    .code-more-img {
        cursor: pointer !important;
        display: block;
        width: 14px;
        height: auto;
        opacity: .65;
    }
</style>

<script>
  function initCodeMoreBox() {
    document.querySelectorAll(".highlight").forEach(codeBlock => {
      if (codeBlock.querySelector('.code-more-box')) return;
      if (codeBlock.scrollHeight <= codeBlock.clientHeight) return;

      const codeMoreBox = document.createElement('div');
      codeMoreBox.classList.add('code-more-box');

      const codeMoreBtn = document.createElement('span');
      codeMoreBtn.classList.add('code-more-btn');
      codeMoreBtn.addEventListener('click', () => {
        codeBlock.classList.add('code-show');
        codeMoreBox.style.display = 'none';
      });

      const img = document.createElement('img');
      img.classList.add('code-more-img');
      // ✅ 核心修复行：直接写静态路径，无任何Hugo资源加载逻辑，永不报错
      img.src = "/icons/codeMore.png";

      codeMoreBtn.appendChild(img);
      codeMoreBox.appendChild(codeMoreBtn);
      codeBlock.appendChild(codeMoreBox);
    });
  }

  document.addEventListener('DOMContentLoaded', initCodeMoreBox);
</script>
