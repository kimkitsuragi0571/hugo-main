{{/* 站点自定义 <head> 片段
   - 字体预加载:让浏览器尽早开始下载中文字体,减少「先默认字体后替换」的闪烁
   - @font-face 移到 head 声明,尽早被浏览器发现
*/}}
{{- $fontName := "JianShouMengWaChaoCuYuanTi-2.ttf" -}}
{{- $fontPath := printf "static/font/%s" $fontName -}}
{{- if fileExists $fontPath -}}
<link rel="preload" href="/font/{{ $fontName }}" as="font" type="font/ttf" crossorigin>
<style>
  @font-face {
    font-family: 'MengWaXiYuan';
    src: url('/font/{{ $fontName }}') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  :root { --font-primary: 'MengWaXiYuan', sans-serif; }
  html, body,
  .article-content,
  .single__contents,
  .widget--toc,
  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-primary) !important;
  }
  .article-content *:not(code):not(pre):not(.chroma):not(.highlight) {
    font-family: inherit !important;
  }
</style>
{{- end -}}
