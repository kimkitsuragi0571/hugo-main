{{- $jsonURL := "/search/index.json" | relURL -}}
<div class="app-searchbar-wrap">
  <form class="app-searchbar search-form" action="{{ "/search/" | relURL }}" data-json="{{ $jsonURL }}" role="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="text" name="keyword" placeholder="搜索文章…" autocomplete="off">
  </form>
  <div class="search-result">
    <h3 class="search-result--title section-title"></h3>
    <div class="search-result--list article-list--compact"></div>
  </div>
</div>
<script>window.searchResultTitleTemplate = "{{ T `search.resultTitle` }}";</script>
{{- $opts := dict "minify" hugo.IsProduction "JSXFactory" "createElement" -}}
{{- $searchScript := resources.Get "ts/search.tsx" | js.Build $opts -}}
<script type="text/javascript" src="{{ $searchScript.RelPermalink }}" defer></script>
